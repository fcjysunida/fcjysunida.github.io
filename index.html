<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />

    <!-- Vista previa al compartir el enlace. La imagen debe ser absoluta:
         los rastreadores no resuelven rutas relativas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FCJYS UNIDA" />
    <meta property="og:locale" content="es_PY" />
    <meta property="og:title" content="Inscripciones y asistencia — FCJYS UNIDA" />
    <meta property="og:description" content="Inscripción a actividades de extensión universitaria y registro de asistencia de la Facultad de Ciencias Jurídicas y Sociales." />
    <meta property="og:url" content="https://fcjysunida.fojas.app/" />
    <meta property="og:image" content="https://fcjysunida.fojas.app/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Inscripciones y asistencia — Facultad de Ciencias Jurídicas y Sociales, UNIDA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Inscripciones y asistencia — FCJYS UNIDA" />
    <meta name="twitter:description" content="Inscripción a actividades de extensión universitaria y registro de asistencia." />
    <meta name="twitter:image" content="https://fcjysunida.fojas.app/assets/og.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff7f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#19120f" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ec3013'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Archivo:wght@400;500;600&display=swap" />
  </head>
  <body>
    <!-- Puente desde el dominio anterior. Las constancias ya impresas y los
         enlaces repartidos por WhatsApp apuntan a fcjysunida.github.io; se
         redirige conservando ruta, búsqueda y ancla para que ninguno muera.
         Va inline y antes del módulo: corre aunque el paquete falle. -->
    <script>
      (function () {
        if (location.hostname !== 'fcjysunida.github.io') return
        var ruta = location.pathname.replace(/^\/fcjysunida(?=\/|$)/, '') || '/'
        location.replace('https://fcjysunida.fojas.app' + ruta + location.search + location.hash)
      })()
    </script>
    <div id="raiz"></div>
    <!-- Red de contención. Si el paquete falla al evaluarse —una variable de
         compilación que faltó, un recurso que no cargó— React nunca monta y el
         visitante ve una pantalla blanca sin una sola pista. Esto escribe un
         mensaje legible y deja el detalle técnico a la vista de quien diagnostica. -->
    <script>
      (function () {
        var fallo = null
        window.addEventListener('error', function (e) { fallo = fallo || (e.message || e.error) })
        window.addEventListener('unhandledrejection', function (e) { fallo = fallo || e.reason })
        window.addEventListener('load', function () {
          setTimeout(function () {
            var r = document.getElementById('raiz')
            if (!r || r.innerHTML.trim() !== '' || !fallo) return
            r.innerHTML =
              '<div style="max-width:34rem;margin:14vh auto;padding:0 1.5rem;' +
              'font-family:system-ui,sans-serif;line-height:1.6;color:#19120f">' +
              '<p style="font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;' +
              'color:#ad331b;font-weight:600;margin:0 0 .75rem">No pudimos abrir el sitio</p>' +
              '<h1 style="font-size:1.6rem;margin:0 0 .75rem;font-weight:600">' +
              'El sitio está mal configurado.</h1>' +
              '<p style="margin:0 0 1.25rem">No es un problema suyo ni de su conexión. ' +
              'Avise a la Coordinación de Extensión y vuelva a intentarlo más tarde.</p>' +
              '<p style="font-size:.8rem;color:#6b5f59;margin:0;word-break:break-word">' +
              'Detalle para quien administra el sitio: ' +
              String(fallo && fallo.message ? fallo.message : fallo) + '</p></div>'
          }, 400)
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
